<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>

<body>

    Nama: <i id="Value_nama"></i>
    <br>
    Umur: <i id="Value_umur"></i>

    <script>

        // String Variable
        var nama = "Ajeng comel";

        // Number Variable
        let umur = 20;
        let tinggi = 158;

        // Array
        let film_favorite = ["Lovely Runner"];

        // Menampilkan ke Console
        console.log("Nama: " + nama);
        console.log("Umur: " + umur);
        console.log("Tinggi: " + tinggi + " cm");
        console.log("Film favorit: " + film_favorite[0]);


        // Arithmetic Operations
        let a = 15;
        let b = 20.2;

        let jumlah = a + b;
        console.log("Hasil penjumlahan a & b: " + jumlah);

        let kurang = a - b;
        console.log("Hasil pengurangan a & b: " + kurang);

        let kali = a * b;
        console.log("Hasil perkalian a & b: " + kali);

        let bagi = a / b;
        console.log("Hasil pembagian a & b: " + bagi);


        // Conditional Statement
        let nilai = 90;

        if (nilai >= 80) {
            console.log("Nilai Anda A");
        } else if (nilai >= 60) {
            console.log("Nilai Anda B");
        } else if (nilai >= 40) {
            console.log("Nilai Anda C");
        } else {
            console.log("Nilai Anda D");
        }


        // Looping
        for (let i = 1; i <= 5; i++) {
            console.log("Perulangan ke-" + i);
        }


        // Menampilkan nama dan umur ke halaman web
        document.getElementById("Value_nama").innerHTML = nama;
        document.getElementById("Value_umur").innerHTML = umur + " tahun";

    </script>

</body>

</html>
